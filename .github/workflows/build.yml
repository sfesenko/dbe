name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Verify launcher through a PATH symlink
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$PWD/dbe" "$RUNNER_TEMP/bin/dbe"
          PATH="$RUNNER_TEMP/bin:$PATH" dbe --help >/dev/null 2>&1

      - name: Upload application JAR
        uses: actions/upload-artifact@v6
        with:
          name: dbe-jar
          path: target/dbe-1.0-SNAPSHOT.jar
          if-no-files-found: error
