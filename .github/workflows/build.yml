name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: dbe-jar
          path: target/dbe-1.0-SNAPSHOT.jar
          if-no-files-found: warn
